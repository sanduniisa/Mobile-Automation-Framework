platformName=Android
automationName=UiAutomator2

appPackage=com.swaglabsmobileapp
appActivity=com.swaglabsmobileapp.MainActivity

autoGrantPermissions=true
noReset=false
adbExecTimeout=60000

implicitWait=10
explicitWait=30

# One Appium server can manage all parallel device sessions.
# Device-specific ports are defined in testng.xml.
appiumHost=http://127.0.0.1

# Emulator 1
device1.udid=emulator-5554
device1.systemPort=8201

# Emulator 2
device2.udid=emulator-5556
device2.systemPort=8202
